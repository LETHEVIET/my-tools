[package]
name = "my-tools"
version = "0.4.0"
edition = "2021"

[dependencies]
gpui-kit = "=0.7.2"
base64 = "0.22"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6"
qrcode = { version = "0.14", default-features = false }
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange",
    "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry",
    "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"
    ,"Win32_Security"
] }

[profile.release]
lto = "thin"
codegen-units = 8
opt-level = 2
strip = "symbols"
