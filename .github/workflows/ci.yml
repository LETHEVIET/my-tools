name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and test Windows applications
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust formatting
        shell: pwsh
        run: |
          rustup component add rustfmt
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo fmt --manifest-path desktop/Cargo.toml --check
      - name: Check updater scripts parse
        shell: pwsh
        run: |
          foreach ($script in @('scripts/update-my-tools.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "$script : $errors" }
          }
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Rust Win32 modules
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Check and build single-file My Tools app
        run: |
          cargo check --locked --manifest-path desktop/Cargo.toml
          cargo build --release --locked --manifest-path desktop/Cargo.toml
      - name: Run Windows HTTP integration tests
        shell: pwsh
        run: |
          $env:MY_TOOLS_AGENT_BIN = (Resolve-Path desktop/target/release/my-tools.exe).Path
          python -m unittest discover -s tests -v
      - name: Preserve CI executables
        uses: actions/upload-artifact@v4
        with:
          name: MyTools-windows-ci
          path: |
            desktop/target/release/my-tools.exe
          if-no-files-found: error
