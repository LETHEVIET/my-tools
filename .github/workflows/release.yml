name: Publish Windows Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches both applications
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Publish only from a version tag such as v0.3.0.' }
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($path in @('rust/Cargo.toml', 'desktop/Cargo.toml')) {
            $found = Select-String -Path $path -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            if (-not $found -or $found.Matches.Groups[1].Value -ne $expected) {
              throw "$path version must match release tag $env:GITHUB_REF_NAME"
            }
          }
      - name: Test and build
        shell: pwsh
        run: |
          rustup component add rustfmt
          cargo fmt --check --manifest-path rust/Cargo.toml
          cargo fmt --check --manifest-path desktop/Cargo.toml
          cargo test --locked --manifest-path rust/Cargo.toml
          cargo build --release --locked --manifest-path rust/Cargo.toml
          cargo build --release --locked --manifest-path desktop/Cargo.toml
          python -m pip install -r requirements.txt
          $env:MY_TOOLS_AGENT_BIN = (Resolve-Path rust/target/release/my-tools-agent.exe).Path
          python -m unittest discover -s tests -v
      - name: Package portable Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          New-Item -ItemType Directory -Path release-dist -Force | Out-Null
          Copy-Item rust/target/release/my-tools-agent.exe release-files/
          Copy-Item desktop/target/release/my-tools.exe release-files/
          Copy-Item scripts/install-my-tools.ps1 release-files/
          Copy-Item MY_TOOLS.md release-files/README.md
          Compress-Archive -Path release-files/* -DestinationPath release-dist/MyTools-windows-x64.zip
          $sha = (Get-FileHash -Algorithm SHA256 release-dist/MyTools-windows-x64.zip).Hash
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path release-dist) 'SHA256SUMS.txt'),
            "$sha  MyTools-windows-x64.zip" + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            release-dist/MyTools-windows-x64.zip `
            release-dist/SHA256SUMS.txt `
            --verify-tag `
            --title "My Tools $env:GITHUB_REF_NAME" `
            --generate-notes
